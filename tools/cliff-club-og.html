<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Source for cliffclub/img/og.jpg (1200x630). Re-render with tools/render-cliff-club-og.sh -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Khand:wght@700&family=Montserrat:wght@500;700;800&display=block">
<style>
:root{
  --cc-cream:#F4EFE6;--cc-black:#0B0B0B;--cc-pink:#E63995;
  --cc-gold:#C9A24A;--cc-gold-warm:#E9C977;--cc-gold-deep:#8E6B2A;
  --cc-slot:#CFC9BF;
  --display:Khand,'Arial Narrow',Impact,sans-serif;
  --body:Montserrat,Arial,sans-serif;
  --gutter:clamp(16px,4vw,48px);
  --rule:2px solid var(--cc-black);
}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--cc-cream);color:var(--cc-black);font-family:var(--body);font-weight:500;font-size:17px;line-height:1.6;overflow-x:clip}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--cc-black);outline-offset:3px}
.on-black :focus-visible{outline-color:var(--cc-cream)}
[id]{scroll-margin-top:88px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1360px;margin:0 auto;padding:0 var(--gutter)}

/* Type */
.display{font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:.82;letter-spacing:-.015em;margin:0}
.eyebrow{font-family:var(--body);font-weight:800;text-transform:uppercase;letter-spacing:.28em;font-size:12px;line-height:1.5;margin:0}
.blk{display:inline-block;line-height:.571;padding:.272em .15em 0;background:var(--cc-black);color:var(--cc-cream)}
.blk-pink{background:var(--cc-pink);color:var(--cc-black)}
.blk-gold{background:var(--cc-gold);color:var(--cc-black)}
.blk-cream{background:var(--cc-cream);color:var(--cc-black)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 22px;font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border:2px solid var(--cc-black);background:var(--cc-pink);color:var(--cc-black);cursor:pointer;text-align:center}
.btn:hover{background:var(--cc-black);color:var(--cc-pink)}
.on-black .btn{border-color:var(--cc-pink)}
.on-black .btn:hover{background:var(--cc-cream);color:var(--cc-black);border-color:var(--cc-cream)}
.btn-black{background:var(--cc-black);color:var(--cc-cream)}
.btn-black:hover{background:var(--cc-cream);color:var(--cc-black)}
.btn[aria-disabled="true"],.btn:disabled{background:rgba(11,11,11,.12);color:var(--cc-black);border:2px dashed var(--cc-black);cursor:not-allowed}
.on-black .btn[aria-disabled="true"]{background:transparent;color:var(--cc-cream);border-color:rgba(244,239,230,.5)}

/* Wordmark */
cc-wordmark{display:inline-flex;flex-direction:column;font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:1;vertical-align:bottom}
cc-wordmark .eq{display:flex;align-items:flex-end;gap:4px;height:.62em;margin-bottom:.06em}
cc-wordmark .eq i{flex:1 1 0;background:var(--cc-black)}
cc-wordmark .eq i.p{background:var(--cc-pink)}
cc-wordmark .words{display:flex}
cc-wordmark .words b{font-weight:700;line-height:.571;padding:.272em .15em 0;letter-spacing:-.015em}
cc-wordmark .w1{background:var(--cc-black);color:var(--cc-cream)}
cc-wordmark .w2{background:var(--cc-pink);color:var(--cc-black)}
cc-wordmark[reverse] .eq i{background:var(--cc-cream)}
cc-wordmark[reverse] .eq i.p{background:var(--cc-pink)}
cc-wordmark[reverse] .w1{background:var(--cc-cream);color:var(--cc-black)}

/* Badge */
cc-badge{position:relative;display:block;width:var(--size,180px);aspect-ratio:1;background:var(--cc-black);border-radius:8px;color:var(--cc-cream);font-family:var(--display);font-weight:700;text-transform:uppercase;transform:rotate(-2deg)}
cc-badge::before{content:"";position:absolute;inset:7px;border:3px solid var(--cc-pink);border-radius:4px;pointer-events:none}
cc-badge .tl,cc-badge .tr{position:absolute;top:16%;font-family:var(--body);font-weight:800;font-size:calc(var(--size,180px) * .065);letter-spacing:.16em;line-height:1}
cc-badge .tl{left:13%;color:var(--cc-gold)}
cc-badge .tr{right:13%;color:var(--cc-cream)}
cc-badge .cc{position:absolute;left:0;right:0;top:50%;transform:translateY(-54%);text-align:center;font-size:calc(var(--size,180px) * .52);line-height:.8;letter-spacing:-.03em}
cc-badge .row{position:absolute;left:13%;right:13%;bottom:13%;height:13%;display:flex;align-items:flex-end;gap:3px}
cc-badge .row i{flex:1 1 0;background:var(--cc-pink)}
cc-badge .row i.g{background:var(--cc-gold)}

/* EQ meter row (decorative) */
cc-eq{display:flex;align-items:flex-end;gap:4px;height:var(--h,28px)}
cc-eq i{flex:1 1 0;background:currentColor}
cc-eq i.p{background:var(--cc-pink)}

/* Header */
.hdr{position:sticky;top:0;z-index:20;background:var(--cc-black);color:var(--cc-cream)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;padding-top:10px;padding-bottom:10px}
.hdr .home{display:inline-flex;align-items:center;min-height:44px;text-decoration:none;font-size:24px}
.hdr nav{display:flex;align-items:center;gap:4px}
.hdr nav a.lnk{display:none;align-items:center;min-height:44px;padding:0 14px;font-weight:800;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none}
.hdr nav a.lnk:hover{color:var(--cc-gold-warm)}
.hdr .btn{min-height:44px;padding:10px 16px;font-size:12px}
@media (min-width:768px){.hdr nav a.lnk{display:inline-flex}.hdr nav{gap:8px}.hdr .btn{margin-left:8px}}

/* Hero */
.hero{border-bottom:var(--rule)}
.hero .wrap{display:grid;gap:22px;padding-top:20px;padding-bottom:40px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.hero-top .lead{display:grid;gap:14px;padding-bottom:14px}
.hero .mark{font-size:clamp(40px,7vw,72px)}
.hero cc-badge{--size:clamp(92px,18vw,168px);flex:0 0 auto;margin-top:4px}
.hero h1{font-size:clamp(64px,17vw,148px);margin-top:4px}
.hero h1 .blk{margin-top:.08em}
.hero .line{font-size:clamp(17px,2vw,22px);font-weight:700;margin:14px 0 0;max-width:24em}
.date-tag{display:inline-block;margin:14px 0 0;background:var(--cc-black);color:var(--cc-gold);font-weight:800;font-size:12px;letter-spacing:.14em;line-height:1.5;text-transform:uppercase;padding:10px 14px}
@media (min-width:1024px){
  .hero .wrap{grid-template-columns:minmax(0,1.25fr) minmax(380px,.75fr);align-items:start;gap:48px;padding-top:44px;padding-bottom:56px}
}

/* Form */
.list{container-type:inline-size;background:var(--cc-black);color:var(--cc-cream);padding:24px clamp(18px,3vw,32px) 28px}
.list h2{font-size:clamp(40px,5vw,56px);margin-bottom:6px}
.list form{display:grid;gap:16px;margin-top:18px}
.list .row2{display:grid;gap:16px}
@container (min-width:520px){.list .row2{grid-template-columns:1fr 1fr}}
.fld{display:grid;gap:8px;font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.fld .opt{font-weight:700;letter-spacing:.06em;text-transform:none;color:var(--cc-gold-warm)}
.fld input{width:100%;min-height:50px;font:500 16px var(--body);color:var(--cc-cream);background:var(--cc-black);border:2px solid rgba(244,239,230,.45);padding:12px 14px;letter-spacing:0;text-transform:none}
.fld input::placeholder{color:rgba(244,239,230,.55)}
.fld input:focus{border-color:var(--cc-cream)}
.fld input[aria-invalid="true"]{border-color:var(--cc-pink)}
.err{font-weight:700;font-size:13px;letter-spacing:0;text-transform:none;color:var(--cc-pink)}
.err:empty{display:none}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;font:800 12px var(--body);letter-spacing:.14em;text-transform:uppercase;background:transparent;color:var(--cc-cream);border:2px solid rgba(244,239,230,.45);border-radius:2px;cursor:pointer}
.chip:hover{border-color:var(--cc-cream)}
.chip[aria-pressed="true"]{background:var(--cc-pink);border-color:var(--cc-pink);color:var(--cc-black)}
.list .submit{width:100%;min-height:56px;font-size:15px}
.list .micro{margin:0;font-weight:700;font-size:14px;line-height:1.5;color:var(--cc-gold-warm)}
.list .status{margin:0;font-weight:700;font-size:14px;color:var(--cc-pink)}
.list .status:empty{display:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{display:grid;gap:18px;padding:12px 0 4px}
.done h2{font-size:clamp(52px,7vw,80px)}
.done p{margin:0}
.done .acts{display:flex;flex-wrap:wrap;gap:10px}

/* Section heads */
.sec{border-bottom:var(--rule);padding:56px 0 64px}
.sec-head{display:grid;gap:14px;margin-bottom:32px}
.sec-head h2{font-size:clamp(64px,11vw,148px)}
.sec-head cc-eq{--h:22px;max-width:420px;color:var(--cc-black)}

/* Events */
.ev-grid{display:grid;gap:2px;background:var(--cc-black);border:var(--rule)}
@media (min-width:900px){.ev-grid{grid-template-columns:1fr 1fr}.ev.feat{grid-column:1 / -1}}
.ev{background:var(--cc-cream);display:grid;align-content:start}
.ev-media{padding:16px 16px 0}
.frame{border:3px solid var(--cc-black);aspect-ratio:1200 / 540;background:var(--cc-slot);overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover}
.slot{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:16px;text-align:center;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cc-black);background:var(--cc-slot)}
.ev-body{display:grid;gap:18px;padding:20px 16px 22px}
.ev-top{display:flex;gap:16px;align-items:flex-start}
.ev-date{flex:0 0 auto;display:grid;justify-items:center;min-width:84px;background:var(--cc-black);color:var(--cc-gold);padding:10px 10px 8px;font-family:var(--display);font-weight:700;text-transform:uppercase;line-height:.82}
.ev-date .d{font-size:56px;letter-spacing:-.02em}
.ev-date .m{font-size:24px;letter-spacing:.04em;margin-top:6px}
.ev-date .t{font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:.18em;color:var(--cc-gold-warm);margin-top:6px}
.ev h3{font-size:clamp(48px,7vw,72px)}
.ev h3 span{display:block}
.ev h3 .blk{display:inline-block;margin-top:.06em}
.ev .ttl{margin:10px 0 0;font-weight:700;font-size:15px;line-height:1.4}
.ev dl{margin:0;display:grid;border-top:var(--rule)}
.ev dl div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid rgba(11,11,11,.25)}
.ev dt{font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding-top:3px}
.ev dd{margin:0;font-size:16px;line-height:1.45}
.spots{display:grid;gap:8px}
.spots .lbl{font-weight:800;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.meter{display:flex;align-items:flex-end;gap:3px;height:30px}
.meter i{flex:1 1 0;height:100%;background:var(--cc-black)}
.meter i.open{background:rgba(11,11,11,.12)}
.ev .btn{justify-self:start}
@media (min-width:900px){
  .ev.feat{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
  .ev.feat .ev-media{padding:24px 0 24px 24px;align-self:start}
  .ev.feat .ev-body{padding:24px}
  .ev.feat h3{font-size:clamp(72px,7.6vw,112px)}
  .ev-media{padding:24px 24px 0}.ev-body{padding:22px 24px 26px}
}
.ev-empty{background:var(--cc-cream);padding:32px 20px;font-weight:700}

/* Lineup */
.lineup-grid{display:grid;gap:32px}
@media (min-width:1024px){.lineup-grid{grid-template-columns:1.1fr .9fr;align-items:start;gap:48px}}
.rows{list-style:none;margin:0;padding:0;border-top:var(--rule)}
.rows li{display:flex;align-items:stretch;gap:16px;border-bottom:var(--rule);padding:10px 0}
.num{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;width:72px;background:var(--cc-gold);color:var(--cc-black);font-family:var(--display);font-weight:700;font-size:44px;line-height:.571;padding:.272em .15em 0}
.rows .lab{display:grid;gap:4px;align-content:center}
.rows .lab strong{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(32px,4.4vw,48px);line-height:.82;letter-spacing:-.015em}
.rows .lab span{font-size:15px;line-height:1.45}
.photo{border:3px solid var(--cc-black);aspect-ratio:4 / 5;background:var(--cc-slot)}

/* What the list gets you */
.gets{display:grid;gap:2px;background:var(--cc-black);border:var(--rule)}
@media (min-width:768px){.gets{grid-template-columns:repeat(3,1fr)}}
.get{padding:24px 20px 28px;display:grid;gap:14px;align-content:start}
.get .n{font-family:var(--display);font-weight:700;font-size:96px;line-height:.82}
.get h3{font-size:clamp(40px,4.6vw,56px)}
.get p{margin:0;font-size:16px}
.get-black{background:var(--cc-black);color:var(--cc-cream)}
.get-black .n{color:var(--cc-gold)}
.get-pink{background:var(--cc-pink);color:var(--cc-black)}
.get-gold{background:var(--cc-gold);color:var(--cc-black)}

/* FAQ */
.faq{border-top:var(--rule);max-width:960px}
.faq details{border-bottom:var(--rule)}
.faq summary{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:12px 0;cursor:pointer;list-style:none;font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(28px,3.6vw,40px);line-height:.9;letter-spacing:-.01em}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:40px;height:40px;background:var(--cc-black);color:var(--cc-cream);font-family:var(--body);font-weight:800;font-size:22px;line-height:1}
.faq details[open] summary::after{content:"\2212";background:var(--cc-pink);color:var(--cc-black)}
.faq details p{margin:0 0 20px;max-width:40em}

/* Follow strip */
.follow{background:var(--cc-pink);color:var(--cc-black);border-bottom:var(--rule)}
.follow .wrap{display:grid;gap:20px;padding-top:40px;padding-bottom:44px}
.follow h2{font-size:clamp(52px,8vw,112px)}
.follow .acts{display:flex;flex-wrap:wrap;gap:10px}
.follow .btn-black[aria-disabled="true"]{background:transparent;color:var(--cc-black);border-color:var(--cc-black)}
@media (min-width:1024px){.follow .wrap{grid-template-columns:1fr auto;align-items:end}}

/* Footer */
.ftr{background:var(--cc-black);color:var(--cc-cream)}
.ftr .wrap{display:grid;gap:22px;padding-top:44px;padding-bottom:28px}
.ftr .mark{font-size:clamp(56px,10vw,120px)}
.ftr .by{display:flex;align-items:center;gap:14px;font-weight:800;font-size:13px;letter-spacing:.28em;text-transform:uppercase}
.ftr .by img{width:56px;height:56px}
.ftr cc-eq{--h:40px;color:var(--cc-cream)}
.ftr small{font-size:12px;color:rgba(244,239,230,.75);letter-spacing:.04em}

html,body{width:1200px;height:630px;overflow:hidden}
.og{position:relative;width:1200px;height:630px;background:var(--cc-cream);border-bottom:22px solid var(--cc-black);padding:44px 56px 0}
.og .eyebrow{font-size:17px}
.og cc-wordmark{font-size:64px;margin-top:20px}
.og h1{font-size:128px;margin-top:26px}
.og cc-badge{--size:180px;position:absolute;right:52px;top:40px}
.og .line{margin:30px 0 0;font-size:30px;font-weight:700}
.og cc-eq{position:absolute;left:56px;right:56px;bottom:0;--h:30px;color:var(--cc-black)}
</style>
<script>
// Cliff Club components. Defined in the head so each tag renders as soon as it is parsed.
(function () {
  var SKY = [30, 60, 90, 45, 100, 70, 35, 80, 55, 95, 40, 75, 25, 65, 88, 50, 72, 30, 58, 84, 42, 66];

  // <cc-wordmark> and <cc-wordmark reverse>. Size it with font-size.
  customElements.define('cc-wordmark', class extends HTMLElement {
    connectedCallback() {
      if (this.firstChild) return;
      this.setAttribute('role', 'img');
      this.setAttribute('aria-label', 'Cliff Club');
      this.innerHTML = '<span class="eq" aria-hidden="true">' + SKY.map(function (h, i) {
        return '<i style="height:' + h + '%"' + (i === 4 || i === 14 ? ' class="p"' : '') + '></i>';
      }).join('') + '</span><span class="words" aria-hidden="true"><b class="w1">Cliff</b><b class="w2">Club</b></span>';
    }
  });

  // <cc-badge>. Size it with --size.
  customElements.define('cc-badge', class extends HTMLElement {
    connectedCallback() {
      if (this.firstChild) return;
      this.setAttribute('role', 'img');
      this.setAttribute('aria-label', 'Cliff Club pop-up, Dallas');
      var row = [40, 70, 55, 90, 35, 65, 100, 50, 80, 45, 60, 30];
      this.innerHTML = '<span class="tl" aria-hidden="true">Pop-up</span><span class="tr" aria-hidden="true">Dallas</span>' +
        '<span class="cc" aria-hidden="true">CC</span><span class="row" aria-hidden="true">' +
        row.map(function (h, i) { return '<i style="height:' + h + '%"' + (i === 6 ? ' class="g"' : '') + '></i>'; }).join('') + '</span>';
    }
  });

  // <cc-eq bars="48"> decorative EQ row. Color comes from currentColor; every 11th bar is pink.
  customElements.define('cc-eq', class extends HTMLElement {
    connectedCallback() {
      if (this.firstChild) return;
      this.setAttribute('aria-hidden', 'true');
      var n = Number(this.getAttribute('bars')) || 48, out = '';
      for (var i = 0; i < n; i++) out += '<i style="height:' + SKY[i % SKY.length] + '%"' + (i % 11 === 4 ? ' class="p"' : '') + '></i>';
      this.innerHTML = out;
    }
  });
})();
</script>
</head>
<body>
<div class="og">
  <p class="eyebrow">Oak Cliff Pilates presents · Vol. 01 · Dallas</p>
  <cc-wordmark></cc-wordmark>
  <h1 class="display">Are you down with<br><span class="blk blk-pink">Cliff Club?</span></h1>
  <p class="line">One day. All of Dallas wellness in one room.</p>
  <cc-badge></cc-badge>
  <cc-eq bars="80"></cc-eq>
</div>
</body>
</html>
